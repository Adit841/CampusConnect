# ==============================================================================
# CampusConnect - Production Profile (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================
# Fail-fast safeguard: In production, explicit database credentials and configuration
# are strictly REQUIRED. This profile NEVER silently falls back to localhost or root.
# ==============================================================================

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# Production Database (MUST be provided via hosting environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=CampusConnectProdPool

# JPA / Hibernate (non-destructive schema updates)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# CORS: Production frontend origin(s) - MUST be explicitly set in host dashboard
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.websocket.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Security: Production JWT Secret - MUST be provided in host dashboard
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Chat module
app.chat.message-max-length=${CHAT_MESSAGE_MAX_LENGTH:4000}
