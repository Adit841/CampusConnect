spring.application.name=campusconnect

server.port=${SERVER_PORT:8080}

# Database (credentials must come from environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# CORS: comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Chat module (ayushman-feature)
app.websocket.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.chat.message-max-length=${CHAT_MESSAGE_MAX_LENGTH:4000}

